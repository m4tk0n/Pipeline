name: Run AI Agent & Deploy Data

on:
  schedule:
    - cron: '0 */6 * * *' # Běží každých 6 hodin zdarma
  workflow_dispatch: # Spuštění tlačítkem ručně

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Klonování repozitáře
        uses: actions/checkout@v4

      - name: 2. Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Instalace závislostí
        run: |
          pip install google-generativeai

      - name: 4. Spuštění Python skriptu (Generování data.json)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agent_runner.py

      - name: 5. Nahrání data.json přes cURL na Webzdarma
        run: |
          curl -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
               -T data.json \
               ftp://${{ secrets.FTP_SERVER }}/pipeline/data.json
