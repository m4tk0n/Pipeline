name: Run AI Agent & Deploy Data

on:
  schedule:
    - cron: '0 */6 * * *' # Běží každých 6 hodin zdarma
  workflow_dispatch: # Spuštění tlačítkem ručně

env:
  FTP_HOST: ${{ secrets.FTP_HOST }}
  FTP_USER: ${{ secrets.FTP_USER }}
  FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
  FTP_DIR: ${{ vars.FTP_DIR || '/pipeline/' }}
  FTP_TLS: ${{ vars.FTP_TLS || '0' }}
  FTP_PORT: ${{ vars.FTP_PORT || '21' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Klonování repozitáře
        uses: actions/checkout@v4

      - name: 2. Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Instalace závislostí
        run: |
          pip install google-generativeai

      - name: 4. Spuštění Python skriptu (Generování data.json)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agent_runner.py

      - name: 5. Nahrání přes ověřený upload skript
        run: |
          python upload_data_json.py
