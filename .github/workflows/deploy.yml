name: Run AI Agent & Deploy Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # KLÍČOVÉ: Povolení pro zápis zpět do repozitáře (git push)
    permissions:
      contents: write

    steps:
      - name: 1. Klonování repozitáře
        uses: actions/checkout@v4

      - name: 2. Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Instalace závislostí
        run: |
          pip install google-generativeai requests beautifulsoup4

      - name: 4. Spuštění Python skriptu (Autonomní agent & sebestředná smyčka)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python agent_runner.py

      - name: 5. Nahrání přes vlastní upload skript (na Webzdarma FTP)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python upload_data_json.py
