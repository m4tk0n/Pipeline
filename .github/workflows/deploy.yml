name: Run AI Agent & Deploy Dashboard

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      task_json:
        description: 'JSON zadani agenta (nepovinne; prazdne = task.json nebo vychozi ukol)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pipeline-ai-agent
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --upgrade requests

      - name: Run multi-turn Gemini agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TASK_JSON: ${{ github.event.inputs.task_json }}
        run: python agent_runner.py

      - name: Upload final dashboard data
        if: always()
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: python upload_data_json.py
